/* =========================

function loadDB(){

  let raw = localStorage.getItem(STORAGE_KEY);

  if(raw){
    try{
      return JSON.parse(raw);
    }catch(e){}
  }

  for(const key of oldKeys){
    const old = localStorage.getItem(key);

    if(old){
      try{
        const parsed = JSON.parse(old);

        return parsed;
      }catch(e){}
    }
  }

  return {};
}


function saveDB(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
}


function getGrowthDate(date){

  const d = new Date(date);

  if(d.getHours() < 4){
    d.setDate(d.getDate()-1);
  }

  return formatDate(d);
}


function formatDate(date){

  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");

  return `${y}-${m}-${d}`;
}


function parseDate(str){
  const [y,m,d] = str.split("-").map(Number);
  return new Date(y,m-1,d);
}


function addDays(str,n){

  const d = parseDate(str);
  d.setDate(d.getDate()+n);

  return formatDate(d);
}

/* =========================
   日期索引
========================= */

function dailyIndex(date){

  const d = parseDate(date);

  const start = new Date(2026,0,1);

  const diff = Math.floor(
    (d-start)/(1000*60*60*24)
  );

  return Math.abs(diff);
}

function getTodayWords(date){

  const index = dailyIndex(date);

  const start =
    (index * 12) % wordBank.length;

  const result=[];

  for(let i=0;i<12;i++){

    result.push(
      wordBank[(start+i)%wordBank.length]
    );

  }

  return result;
}


/* 获取词典数据 */

async function fetchDictionary(word){

  try{

    const response =
      await fetch(
        "https://api.dictionaryapi.dev/api/v2/entries/en/" +
        encodeURIComponent(word)
      );

    if(!response.ok){
      return null;
    }

    const data = await response.json();

    if(!Array.isArray(data) || !data.length){
      return null;
    }

    const entry = data[0];

    let ipa = "";

    let audio = "";

    /*
      优先寻找带 audio 的 phonetic。
      Dictionary API 的音频通常来自其词典音频源。
    */

    if(Array.isArray(entry.phonetics)){

      const withAudio =
        entry.phonetics.find(
          p => p.audio && p.audio.length > 0
        );

      const phonetic =
        entry.phonetics.find(
          p => p.text && p.text.length > 0
        );

      if(phonetic){
        ipa = phonetic.text;
      }

      if(withAudio){
        audio = withAudio.audio;
      }

    }

    /*
      如果第一个 entry 没找到，再遍历其它 entry。
    */

    if((!ipa || !audio) && data.length>1){

      for(const e of data){

        if(!Array.isArray(e.phonetics)) continue;

        if(!ipa){

          const p =
            e.phonetics.find(
              x => x.text && x.text.length>0
            );

          if(p) ipa=p.text;

        }

        if(!audio){

          const p =
            e.phonetics.find(
              x => x.audio && x.audio.length>0
            );

          if(p) audio=p.audio;

        }

      }

    }

    return {
      ipa,
      audio
    };

  }catch(error){

    console.log(
      "Dictionary API error:",
      word,
      error
    );

    return null;
  }
}


/* 音频缓存 */

const audioCache={};


async function playWord(word,speed=1){

  let info = audioCache[word];

  if(info === undefined){

    info = await fetchDictionary(word);

    audioCache[word] = info || null;
  }

  if(!info || !info.audio){

    alert(
      "这个单词暂时没有找到可用的词典音频。\n\n" +
      "可以继续学习，不影响打卡。"
    );

    return;
  }

  const audio = new Audio(info.audio);

  audio.playbackRate = speed;

  audio.volume = 1;

  try{
    await audio.play();
  }catch(error){

    alert(
      "音频播放失败，请确认手机当前允许网页播放声音。"
    );

  }

}


function getWordInfo(word){

  return current().wordInfo?.[word] || null;
}


function ensureWordInfo(word){

  const d=current();

  if(!d.wordInfo){
    d.wordInfo={};
  }

  if(!d.wordInfo[word]){
    d.wordInfo[word]={
      ipa:"",
      audio:"",
      loaded:false
    };
  }

  return d.wordInfo[word];
}


async function loadWordInfo(word){

  const d=current();

  const info=ensureWordInfo(word);

  if(info.loaded){
    return info;
  }

  const data =
    await fetchDictionary(word);

  if(data){

    info.ipa=data.ipa || "";

    info.audio=data.audio || "";

  }

  info.loaded=true;

  saveDB();

  return info;
}

function setReview(word,state){

  const previousDate =
    addDays(selectedDate,-1);

  if(!db[previousDate]){
    return;
  }

  if(!db[previousDate].reviewWords){
    db[previousDate].reviewWords={};
  }

  db[previousDate].reviewWords[word]=state;

  saveDB();

  renderReview();
}


function playReview(word,speed){

  playWordFromDate(
    word,
    addDays(selectedDate,-1),
    speed
  );

}


async function playWordFromDate(word,date,speed){

  let info =
    db[date]?.wordInfo?.[word];

  if(!info || !info.audio){

    const data =
      await fetchDictionary(word);

    if(data){

      if(!db[date].wordInfo){
        db[date].wordInfo={};
      }

      db[date].wordInfo[word]={
        ipa:data.ipa || "",
        audio:data.audio || "",
        loaded:true
      };

      saveDB();

      info=db[date].wordInfo[word];

    }

  }

  if(!info || !info.audio){

    alert(
      "这个单词暂时没有找到可用的词典音频。"
    );

    return;
  }

  const audio =
    new Audio(info.audio);

  audio.playbackRate=speed;

  try{
    await audio.play();
  }catch(e){

    alert(
      "音频播放失败，请检查手机声音或网页播放权限。"
    );

  }

}


/* =========================
   成长评分
========================= */

function calculateScore(date){

  const d=db[date] || {};

  let action=0;
  let body=0;
  let english=0;
  let learn=0;
  let observe=0;

  /*
    行动 30
  */

  if(
    d.keyAction &&
    d.keyAction.trim().length>=5 &&
    d.actionResult &&
    d.actionResult.trim().length>=5
  ){
    action=30;
  }

  /*
    身体 15
  */

  if(
    d.body &&
    d.body.trim().length>=8
  ){
    body=15;
  }

  /*
    英语 15
  */

  const words =
    getTodayWords(date);

  const englishStates =
    words.filter(
      x=>d.words?.[x[0]]
    ).length;

  if(englishStates>=6){
    english=15;
  }

  /*
    商业/经济思考 20
  */

  if(
    d.thinking &&
    d.thinking.trim().length>=15
  ){
    learn=20;
  }

  /*
    观察 10
  */

  if(
    d.discovery &&
    d.discovery.trim().length>=8
  ){
    observe+=10;
  }

  /*
    突破 10
  */

  if(
    d.breakthrough &&
    d.breakthrough.trim().length>=8
  ){
    observe+=10;
  }

  let total =
    action+
    body+
    english+
    learn+
    observe;

  /*
    如果没有真正行动，最高30。
  */

  const hasRealAction =
    d.keyAction &&
    d.keyAction.trim().length>=5 &&
    d.actionResult &&
    d.actionResult.trim().length>=5;

  if(!hasRealAction){
    total=Math.min(total,30);
  }

  return {
    total,
    action,
    body,
    english,
    learn,
    observe
  };

}


function renderScore(){

  const s =

/* =========================

========================= */

function escapeHtml(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
